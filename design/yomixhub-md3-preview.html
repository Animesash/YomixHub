<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YomixHub — Material 3 · превью экрана</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ================= YomixHub · Material 3 dark preview =================
     412dp baseline phone · MD3 tokens as CSS variables.
     dp == px throughout, exactly like a Compose preview.               */

  :root {
    --backdrop-1: #0d0b11;
    --backdrop-2: #131019;
    --frame: #060608;
  }

  /* ---------- Material You seed palettes (tonal) ---------- */
  .phone[data-seed="violet"] {
    --primary: #D0BCFF;              --on-primary: #381E72;
    --primary-container: #4F378B;    --on-primary-container: #EADDFF;
    --secondary: #CCC2DC;
    --secondary-container: #4A4458;  --on-secondary-container: #E8DEF8;
    --tertiary-container: #633B48;   --on-tertiary-container: #FFD8E4;
    --error: #F2B8B5;                --on-error: #601410;
    --surface: #141218;              --on-surface: #E6E0E9;
    --on-surface-variant: #CAC4D0;
    --surface-container-lowest: #0F0D13;
    --surface-container-low: #1D1B20;
    --surface-container: #211F26;
    --surface-container-high: #2B2930;
    --surface-container-highest: #36343B;
    --outline: #938F99;              --outline-variant: #49454F;
  }
  .phone[data-seed="ocean"] {
    --primary: #A8C8FF;              --on-primary: #003060;
    --primary-container: #004787;    --on-primary-container: #D4E3FF;
    --secondary: #BFC8DC;
    --secondary-container: #3F4859;  --on-secondary-container: #DCE3F9;
    --tertiary-container: #4E4358;   --on-tertiary-container: #F2DAFF;
    --error: #F2B8B5;                --on-error: #601410;
    --surface: #111318;              --on-surface: #E2E1E9;
    --on-surface-variant: #C4C6D0;
    --surface-container-lowest: #0C0E13;
    --surface-container-low: #191C20;
    --surface-container: #1D2024;
    --surface-container-high: #282A2F;
    --surface-container-highest: #33353A;
    --outline: #8E9099;              --outline-variant: #44474E;
  }
  .phone[data-seed="sakura"] {
    --primary: #FFB1C8;              --on-primary: #5E1130;
    --primary-container: #7D2949;    --on-primary-container: #FFD9E2;
    --secondary: #E2BDC7;
    --secondary-container: #5A3F48;  --on-secondary-container: #FFD9E4;
    --tertiary-container: #5F4100;   --on-tertiary-container: #FFDFB4;
    --error: #F2B8B5;                --on-error: #601410;
    --surface: #191113;              --on-surface: #F0DEE1;
    --on-surface-variant: #D7C2C4;
    --surface-container-lowest: #140C0E;
    --surface-container-low: #221719;
    --surface-container: #261B1D;
    --surface-container-high: #322527;
    --surface-container-highest: #3D3032;
    --outline: #9F8C8E;              --outline-variant: #5D4344;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; }

  body {
    font-family: Roboto, "Google Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    background:
      radial-gradient(900px 640px at 18% -10%, color-mix(in srgb, var(--page-accent, #D0BCFF) 9%, transparent), transparent 60%),
      radial-gradient(1000px 800px at 110% 110%, color-mix(in srgb, var(--page-accent, #D0BCFF) 7%, transparent), transparent 55%),
      linear-gradient(160deg, var(--backdrop-2), var(--backdrop-1));
    color: #E6E0E9;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    min-height: 100vh;
    padding: 26px 16px 44px;
  }

  /* ================= page header ================= */
  .page-head {
    width: min(920px, 100%);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 18px;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-mark {
    width: 44px; height: 44px; border-radius: 14px;
    background: linear-gradient(135deg, var(--page-accent, #D0BCFF), #633B48);
    color: #14121A;
    display: flex; align-items: center; justify-content: center;
    font-size: 23px; font-weight: 700;
    box-shadow: 0 6px 20px color-mix(in srgb, var(--page-accent, #D0BCFF) 28%, transparent);
  }
  .brand h1 { font-size: 21px; font-weight: 500; letter-spacing: .2px; color: #EFEBF4; }
  .brand p { font-size: 12.5px; color: #9b93a5; margin-top: 2px; }

  .seed-picker { display: flex; flex-direction: column; gap: 7px; align-items: flex-end; }
  .seed-picker .cap { font-size: 10.5px; letter-spacing: 1.4px; text-transform: uppercase; color: #857e92; font-weight: 500; }
  .seed-row { display: flex; gap: 8px; }
  .seed-btn {
    display: flex; align-items: center; gap: 7px;
    height: 34px; padding: 0 13px;
    border-radius: 17px; border: 1px solid #332e3e;
    background: rgba(255,255,255,.03);
    color: #b6aebf; font: 500 12.5px/1 Roboto, sans-serif;
    cursor: pointer; transition: all .2s;
  }
  .seed-btn:hover { background: rgba(255,255,255,.07); color: #ded7e6; }
  .seed-btn.active { border-color: color-mix(in srgb, var(--page-accent, #D0BCFF) 55%, transparent); color: #f2eef7; background: color-mix(in srgb, var(--page-accent, #D0BCFF) 12%, rgba(255,255,255,.03)); }
  .seed-btn .dot { width: 13px; height: 13px; border-radius: 50%; }

  /* ================= phone frame ================= */
  .stage { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .phone-scale { transform-origin: top center; }

  .phone {
    position: relative;
    width: 434px; height: 937px;
    background: var(--frame);
    border-radius: 54px;
    padding: 11px;
    box-shadow:
      0 40px 90px -20px rgba(0,0,0,.75),
      0 0 0 1px #1d1b22,
      inset 0 0 0 1.5px #26232c;
  }
  .phone .btn-power, .phone .btn-vol {
    position: absolute; right: -3px; width: 3px; border-radius: 0 3px 3px 0;
    background: linear-gradient(180deg, #34313b, #201d25);
  }
  .btn-power { top: 236px; height: 92px; }
  .btn-vol { top: 128px; height: 56px; }

  .screen {
    position: relative;
    width: 412px; height: 915px;
    background: var(--surface);
    border-radius: 44px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    color: var(--on-surface);
  }

  /* ================= status bar ================= */
  .statusbar {
    position: relative;
    height: 36px; flex: none;
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 26px 0 28px;
    font-size: 15px; font-weight: 500;
    color: var(--on-surface);
    z-index: 5;
  }
  .status-icons { display: flex; align-items: center; gap: 7px; }
  .status-icons svg { display: block; }
  .punch-hole {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 12px; height: 12px; border-radius: 50%;
    background: #050508;
    box-shadow: inset 0 0 2px rgba(255,255,255,.25);
  }

  /* ================= top app bar (medium → small) ================= */
  .topbar {
    position: relative;
    height: 112px; flex: none;
    background: var(--surface);
    transition: background-color .25s ease;
    z-index: 4;
  }
  .topbar.scrolled { background: var(--surface-container); }
  .topbar-title {
    position: absolute; left: 16px;
    font-weight: 400; letter-spacing: 0;
    color: var(--on-surface);
    line-height: 1.28;
    will-change: top, font-size;
  }
  .topbar-actions { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); display: flex; }
  .icon-btn {
    width: 48px; height: 48px; border-radius: 50%;
    border: none; background: transparent; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--on-surface);
    transition: background-color .18s;
  }
  .icon-btn:hover { background: var(--surface-container-high); }
  .icon-btn:active { background: var(--surface-container-highest); }

  /* ================= content ================= */
  .content { flex: 1; min-height: 0; position: relative; }
  .tab { display: none; height: 100%; overflow-y: auto; overscroll-behavior: contain; }
  .tab.active { display: block; }
  .tab::-webkit-scrollbar { width: 4px; }
  .tab::-webkit-scrollbar-thumb { background: var(--outline-variant); border-radius: 2px; }

  .chips-row {
    display: flex; gap: 8px;
    padding: 6px 16px 6px;
    overflow-x: auto; scrollbar-width: none;
  }
  .chips-row::-webkit-scrollbar { display: none; }
  .fchip {
    flex: none; height: 32px; padding: 0 14px;
    display: flex; align-items: center;
    border-radius: 8px;
    background: transparent;
    border: 1px solid var(--outline-variant);
    color: var(--on-surface-variant);
    font: 500 14px/1 Roboto, sans-serif;
    cursor: pointer; transition: all .18s;
  }
  .fchip:hover { background: color-mix(in srgb, var(--on-surface) 6%, transparent); }
  .fchip.selected {
    background: var(--secondary-container);
    border-color: transparent;
    color: var(--on-secondary-container);
  }

  .section-head { padding: 14px 16px 10px; }
  .section-head h2 { font-size: 16px; font-weight: 500; color: var(--on-surface); letter-spacing: .15px; }
  .section-head p { font-size: 12px; color: var(--on-surface-variant); margin-top: 3px; }

  /* ---------- card grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px 8px;
    padding: 2px 16px 28px;
  }
  .card {
    background: var(--surface-container-low);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 1px 3px rgba(0,0,0,.35);
    transition: transform .18s ease, background-color .18s;
    animation: cardIn .45s cubic-bezier(.2,0,0,1) backwards;
  }
  .card:hover { background: var(--surface-container); transform: translateY(-2px); }
  @keyframes cardIn { from { opacity: 0; transform: translateY(14px); } }

  .cover { position: relative; aspect-ratio: 2 / 3; background: var(--surface-container); }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .fmt-chip {
    position: absolute; left: 6px; bottom: 6px;
    height: 20px; padding: 0 7px;
    display: flex; align-items: center;
    border-radius: 6px;
    font-size: 10px; font-weight: 600; letter-spacing: .8px;
    backdrop-filter: blur(4px);
  }
  .fmt-chip.manga { background: var(--secondary-container); color: var(--on-secondary-container); }
  .fmt-chip.novel { background: var(--tertiary-container); color: var(--on-tertiary-container); }
  .unread-chip {
    position: absolute; top: 6px; right: 6px;
    height: 20px; padding: 0 7px;
    display: flex; align-items: center;
    border-radius: 10px;
    background: var(--primary); color: var(--on-primary);
    font-size: 11px; font-weight: 600;
    box-shadow: 0 1px 4px rgba(0,0,0,.4);
  }
  .card-body { padding: 8px 10px 10px; }
  .card-body h3 {
    font-size: 14px; font-weight: 500; line-height: 1.32;
    color: var(--on-surface);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; min-height: 37px;
  }
  .card-body p {
    margin-top: 3px;
    font-size: 12px; color: var(--on-surface-variant);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .empty-note { padding: 28px 16px; font-size: 13px; color: var(--on-surface-variant); text-align: center; }

  /* ---------- list rows (notifications / downloads) ---------- */
  .list { padding-bottom: 24px; }
  .row {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 16px;
    cursor: pointer;
    transition: background-color .18s;
  }
  .row:hover { background: color-mix(in srgb, var(--on-surface) 5%, transparent); }
  .row .thumb {
    flex: none; width: 44px; height: 60px; border-radius: 8px; overflow: hidden;
    background: var(--surface-container);
    box-shadow: 0 1px 3px rgba(0,0,0,.35);
  }
  .row .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .row .mid { flex: 1; min-width: 0; }
  .row .mid h4 {
    font-size: 15px; font-weight: 500; color: var(--on-surface);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row .mid .sub { margin-top: 2px; font-size: 12.5px; color: var(--on-surface-variant); }
  .row .tail { flex: none; display: flex; align-items: center; }

  .dot-unread {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--error);
    transition: opacity .4s, transform .4s;
  }
  .dot-unread.gone { opacity: 0; transform: scale(.3); }

  .progress-track {
    margin-top: 6px;
    height: 4px; border-radius: 2px;
    background: var(--surface-container-highest);
    overflow: hidden;
  }
  .progress-fill { height: 100%; border-radius: 2px; background: var(--primary); transition: width .5s ease; }
  .progress-fill.paused { background: var(--secondary); }

  .ring-badge, .mini-ring {
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--surface-container-highest);
    display: flex; align-items: center; justify-content: center;
  }
  .mini-ring { width: 16px; height: 16px; background: transparent; }
  .ring-fill {
    width: 100%; height: 100%; border-radius: 50%;
    background: conic-gradient(var(--primary) calc(var(--p) * 1%), var(--surface-container-highest) 0);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2.4px), #000 calc(100% - 2px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 2.4px), #000 calc(100% - 2px));
  }
  .ring-badge .ring-fill { transform: scale(.8); }

  .check-badge {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--primary-container); color: var(--on-primary-container);
    display: flex; align-items: center; justify-content: center;
  }
  .queued-badge { width: 20px; height: 20px; border-radius: 50%; background: var(--surface-container-highest); }

  .divider { height: 1px; background: var(--outline-variant); opacity: .45; margin-left: 76px; }

  /* ================= navigation bar (MD3, 80dp) ================= */
  .navbar {
    flex: none; height: 80px;
    background: var(--surface-container);
    display: flex;
    z-index: 6;
  }
  .nav-item {
    flex: 1;
    border: none; background: transparent; font-family: inherit;
    display: flex; flex-direction: column; align-items: center;
    padding-top: 12px; gap: 5px;
    cursor: pointer;
  }
  .nav-item .icon-wrap { position: relative; width: 64px; height: 32px; display: flex; align-items: center; justify-content: center; }
  .nav-item .pill {
    position: absolute; inset: 0;
    border-radius: 16px;
    background: var(--secondary-container);
    opacity: 0; transform: scale(.72);
    transition: opacity .22s cubic-bezier(.2,0,0,1), transform .22s cubic-bezier(.2,0,0,1);
  }
  .nav-item.active .pill { opacity: 1; transform: scale(1); }
  .nav-item .icons { position: relative; z-index: 1; color: var(--on-surface-variant); transition: color .22s; }
  .nav-item.active .icons { color: var(--on-secondary-container); }
  .nav-item .icons .ic { display: none; }
  .nav-item.active .icons .ic-f { display: block; }
  .nav-item:not(.active) .icons .ic-o { display: block; }
  .nav-item .nav-label {
    font-size: 12px; font-weight: 500; line-height: 1;
    color: var(--on-surface-variant);
    transition: color .22s;
  }
  .nav-item.active .nav-label { color: var(--on-secondary-container); font-weight: 600; }

  .notif-badge {
    position: absolute; top: -7px; right: -1px;
    min-width: 18px; height: 18px; padding: 0 5px;
    border-radius: 9px;
    background: var(--error); color: var(--on-error);
    font-size: 11px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    z-index: 2;
    transition: opacity .35s, transform .35s;
  }
  .notif-badge.cleared { opacity: 0; transform: scale(.4); }

  .dl-badge { position: absolute; top: -8px; right: -3px; z-index: 2; }

  .gesture-pill {
    position: absolute; bottom: 7px; left: 50%; transform: translateX(-50%);
    width: 108px; height: 4px; border-radius: 2px;
    background: color-mix(in srgb, var(--on-surface) 42%, transparent);
    z-index: 8;
  }

  .hint { font-size: 12.5px; color: #8d8599; text-align: center; max-width: 460px; }
  .hint b { color: #b9b1c4; font-weight: 500; }
</style>
</head>
<body>

<header class="page-head">
  <div class="brand">
    <div class="brand-mark">Y</div>
    <div>
      <h1>YomixHub</h1>
      <p>Manga &amp; light novel reader · Material 3 · тёмная тема · dynamic color</p>
    </div>
  </div>
  <div class="seed-picker">
    <span class="cap">Material You seed</span>
    <div class="seed-row">
      <button class="seed-btn active" data-seed="violet"><span class="dot" style="background:#D0BCFF"></span>Фиалка</button>
      <button class="seed-btn" data-seed="ocean"><span class="dot" style="background:#A8C8FF"></span>Океан</button>
      <button class="seed-btn" data-seed="sakura"><span class="dot" style="background:#FFB1C8"></span>Сакура</button>
    </div>
  </div>
</header>

<main class="stage">
  <div class="phone-scale" id="phoneScale">
    <div class="phone" id="phone" data-seed="violet">
      <div class="btn-vol"></div>
      <div class="btn-power"></div>

      <div class="screen">
        <!-- status bar -->
        <div class="statusbar">
          <span>21:47</span>
          <span class="punch-hole"></span>
          <span class="status-icons">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M2 22h20V2L2 22z"/></svg>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12.01 21.49L23.64 7c-.45-.34-4.93-4-11.64-4C5.28 3 .81 6.66.36 7l11.63 14.49.01.01z"/></svg>
            <svg width="24" height="17" viewBox="0 0 26 17"><rect x="1" y="2.5" width="19" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".55"/><rect x="3.2" y="4.7" width="11.5" height="7.6" rx="1.5" fill="currentColor"/><path d="M22.6 6.4v4.2" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" opacity=".55"/></svg>
          </span>
        </div>

        <!-- medium top app bar -->
        <div class="topbar" id="topbar">
          <div class="topbar-title" id="topbarTitle">YomixHub</div>
          <div class="topbar-actions">
            <button class="icon-btn" title="Поиск" aria-label="Поиск">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </button>
            <button class="icon-btn" title="Фильтры" aria-label="Фильтры">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg>
            </button>
          </div>
        </div>

        <!-- tabbed content -->
        <div class="content" id="content">
          <section class="tab" data-tab="library"></section>
          <section class="tab active" data-tab="explore"></section>
          <section class="tab" data-tab="notifications"></section>
          <section class="tab" data-tab="downloads"></section>
        </div>

        <!-- MD3 navigation bar -->
        <nav class="navbar" id="navbar">
          <button class="nav-item" data-tab="library" aria-label="Закладки">
            <span class="icon-wrap">
              <span class="pill"></span>
              <span class="icons">
                <svg class="ic ic-f" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
                <svg class="ic ic-o" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2zm0 15l-5-2.18L7 18V5h10v13z"/></svg>
              </span>
            </span>
            <span class="nav-label">Закладки</span>
          </button>

          <button class="nav-item active" data-tab="explore" aria-label="Все тайтлы">
            <span class="icon-wrap">
              <span class="pill"></span>
              <span class="icons">
                <svg class="ic ic-f" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
                <svg class="ic ic-o" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>

/* ============================ rendering ============================ */

const byId = (id) => TITLES.find((t) => t.id === id);
const $ = (sel, root = document) => root.querySelector(sel);

function cardHtml(t, opts = {}) {
  const chipCls = t.fmt === 'MANGA' ? 'manga' : 'novel';
  const unread = opts.showUnread && t.unread > 0
    ? `<span class="unread-chip">${t.unread} гл.</span>` : '';
  return `
    <article class="card" data-fmt="${t.fmt}" data-id="${t.id}" style="animation-delay:${(opts.index ?? 0) * 45}ms">
      <div class="cover">
        <img src="${t.cover}" alt="${t.name}">
        <span class="fmt-chip ${chipCls}">${t.fmt}</span>
        ${unread}
      </div>
      <div class="card-body">
        <h3>${t.name}</h3>
        <p>Т. ${t.vol} · Гл. ${t.ch} · ★ ${t.rating}</p>
      </div>
    </article>`;
}

function gridHtml(list, opts) {
  if (!list.length) return '<p class="empty-note">Здесь пока пусто</p>';
  return `<div class="grid">${list.map((t, i) => cardHtml(t, { ...opts, index: i })).join('')}</div>`;
}

function chipsHtml(items, group) {
  return `<div class="chips-row" data-group="${group}">` + items.map((c, i) =>
    `<button class="fchip${i === 0 ? ' selected' : ''}" data-filter="${c.value}">${c.label}</button>`
  ).join('') + `</div>`;
}

function renderExplore() {
  const sec = $('[data-tab="explore"]');
  sec.innerHTML =
    chipsHtml([
      { label: 'Все', value: 'ALL' },
      { label: 'Манга', value: 'MANGA' },
      { label: 'Новеллы', value: 'NOVEL' },
    ], 'explore') +
    `<div class="section-head">
       <h2>Популярное сейчас</h2>
       <p>Каталог внешних источников · обновлено 5 мин назад</p>
     </div>` +
    gridHtml(TITLES);
  sec.addEventListener('click', (e) => {
    const chip = e.target.closest('.fchip');
    if (!chip) return;
    sec.querySelectorAll('.fchip').forEach((c) => c.classList.toggle('selected', c === chip));
    const f = chip.dataset.filter;
    const list = f === 'ALL' ? TITLES : TITLES.filter((t) => t.fmt === f);
    const grid = sec.querySelector('.grid');
    grid.outerHTML = gridHtml(list);
  });
}

function renderLibrary() {
  const sec = $('[data-tab="library"]');
  const render = (f) => {
    let list = LIBRARY_IDS.map(byId);
    if (f === 'READING') list = list.filter((t) => parseFloat(t.rating.replace(',', '.')) > 8.9);
    if (f === 'PLANNED') list = list.filter((t) => t.vol > 20);
    if (f === 'COMPLETED') list = list.filter((t) => t.unread === 0);
    const grid = sec.querySelector('.grid');
    if (grid) grid.outerHTML = gridHtml(list, { showUnread: true });
    else sec.insertAdjacentHTML('beforeend', gridHtml(list, { showUnread: true }));
  };
  sec.innerHTML =
    chipsHtml([
      { label: 'Все · 10', value: 'ALL' },
      { label: 'Читаю', value: 'READING' },
      { label: 'В планах', value: 'PLANNED' },
      { label: 'Прочитано', value: 'COMPLETED' },
    ], 'library') +
    `<div class="section-head">
       <h2>Моя библиотека</h2>
       <p>10 тайтлов · 177 непрочитанных глав</p>
     </div>`;
  render('ALL');
  sec.addEventListener('click', (e) => {
    const chip = e.target.closest('.fchip');
    if (!chip) return;
    sec.querySelectorAll('.fchip').forEach((c) => c.classList.toggle('selected', c === chip));
    render(chip.dataset.filter);
  });
}

function rowHtml(u) {
  const t = byId(u.id);
  return `
    <div class="row" data-unread="${u.unread}">
      <span class="thumb"><img src="${t.cover}" alt=""></span>
      <div class="mid">
        <h4>${t.name}</h4>
        <div class="sub">Новая глава ${u.chapter} · ${u.time}</div>
      </div>
      <span class="tail">${u.unread ? '<span class="dot-unread"></span>' : ''}</span>
    </div>
    <div class="divider"></div>`;
}

function renderNotifications() {
  const sec = $('[data-tab="notifications"]');
  const today = UPDATES.filter((u) => u.today);
  const week = UPDATES.filter((u) => !u.today);
  sec.innerHTML =
    `<div class="section-head"><h2>Сегодня</h2></div>` +
    `<div class="list">${today.map(rowHtml).join('')}</div>` +
    `<div class="section-head"><h2>На этой неделе</h2></div>` +
    `<div class="list">${week.map(rowHtml).join('')}</div>`;
}

function renderDownloads() {
  const sec = $('[data-tab="downloads"]');
  const rows = DOWNLOADS.map((d) => {
    const t = byId(d.id);
    let progress = '';
    if (d.status !== 'QUEUED') {
      progress = `<div class="progress-track"><div class="progress-fill${d.status === 'PAUSED' ? ' paused' : ''}" data-progress="${d.progress}" style="width:${d.progress}%"></div></div>`;
    } else {
      progress = `<div class="progress-track"></div>`;
    }
    let tail = '';
    if (d.status === 'ACTIVE') tail = `<span class="ring-badge"><span class="ring-fill" style="--p:${d.progress}"></span></span>`;
    if (d.status === 'PAUSED') tail = `<svg width="20" height="20" viewBox="0 0 24 24" fill="var(--on-surface-variant)"><rect x="7" y="5" width="3.6" height="14" rx="1.8"/><rect x="13.4" y="5" width="3.6" height="14" rx="1.8"/></svg>`;
    if (d.status === 'QUEUED') tail = `<span class="queued-badge"></span>`;
    if (d.status === 'DONE') tail = `<span class="check-badge"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>`;
    return `
      <div class="row" data-dl="${d.id}">
        <span class="thumb"><img src="${t.cover}" alt=""></span>
        <div class="mid">
          <h4>${t.name}</h4>
          ${progress}
          <div class="sub" style="margin-top:5px">Глава ${d.chapter} · ${d.label}</div>
        </div>
        <span class="tail">${tail}</span>
      </div>
      <div class="divider"></div>`;
  }).join('');
  sec.innerHTML =
    `<div class="section-head">
       <h2>Очередь загрузки</h2>
       <p>2 активных · 12,4 ГБ свободно</p>
     </div>` +
    `<div class="list">${rows}</div>`;
}

/* ============================ top bar collapse ============================ */

const topbar = $('#topbar');
const topbarTitle = $('#topbarTitle');
const EXPANDED_H = 112, COLLAPSED_H = 64, RANGE = EXPANDED_H - COLLAPSED_H;

function applyTopBar(scrollTop) {
  const t = Math.max(0, Math.min(1, scrollTop / RANGE));
  const barH = EXPANDED_H - RANGE * t;
  const fontSize = 28 - 6 * t;
  const lineH = fontSize * 1.28;
  const bottomAnchored = barH - 12 - lineH;
  const centered = (barH - lineH) / 2;
  const top = bottomAnchored + (centered - bottomAnchored) * t;

  topbar.style.height = barH + 'px';
  topbarTitle.style.fontSize = fontSize + 'px';
  topbarTitle.style.top = top + 'px';
  topbar.classList.toggle('scrolled', t > 0.35);
}

document.querySelectorAll('.tab').forEach((sec) => {
  sec.addEventListener('scroll', () => {
    if (sec.classList.contains('active')) applyTopBar(sec.scrollTop);
  });
});

/* ============================ tab switching ============================ */

const notifBadge = $('#notifBadge');
let notifCleared = false;

document.querySelectorAll('.nav-item').forEach((btn) => {
  btn.addEventListener('click', () => {
    const name = btn.dataset.tab;
    document.querySelectorAll('.nav-item').forEach((b) => b.classList.toggle('active', b === btn));
    document.querySelectorAll('.tab').forEach((s) => s.classList.toggle('active', s.dataset.tab === name));
    const sec = $(`.tab[data-tab="${name}"]`);
    applyTopBar(sec.scrollTop);

    if (name === 'notifications' && !notifCleared) {
      notifCleared = true;
      setTimeout(() => {
        notifBadge.classList.add('cleared');
        document.querySelectorAll('.tab[data-tab="notifications"] .dot-unread').forEach((d) => d.classList.add('gone'));
      }, 900);
    }
  });
});

    const fill = first.querySelector('.progress-fill');
    const ring = first.querySelector('.ring-fill');
    if (fill) fill.style.width = Math.min(100, dlPct) + '%';
    if (ring) ring.style.setProperty('--p', Math.min(100, dlPct).toFixed(1));
    const sub = first.querySelector('.sub');
    if (sub) sub.textContent = `Глава 205 · ${Math.floor(dlPct)}% · 1,2 МБ/с`;
  }
}, 140);

/* ============================ seed switching ============================ */

const SEED_ACCENTS = { violet: '#D0BCFF', ocean: '#A8C8FF', sakura: '#FFB1C8' };
document.querySelectorAll('.seed-btn').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.seed-btn').forEach((b) => b.classList.toggle('active', b === btn));
    const seed = btn.dataset.seed;
    $('#phone').dataset.seed = seed;
    document.documentElement.style.setProperty('--page-accent', SEED_ACCENTS[seed]);
  });
});

/* ============================ fit to viewport ============================ */

function fitPhone() {
  const wrap = $('#phoneScale');
  const scale = Math.min(1, (window.innerHeight - 190) / 937, (window.innerWidth - 28) / 434);
  wrap.style.transform = `scale(${Math.max(0.45, scale)})`;
  wrap.style.height = 937 * Math.max(0.45, scale) + 'px';
}
window.addEventListener('resize', fitPhone);

/* ============================ boot ============================ */

renderExplore();
renderLibrary();
renderNotifications();
renderDownloads();
applyTopBar(0);
fitPhone();
</script>
</body>
